name: Live API checks

# Real calls to xAI, Stripe test mode and Printful, to catch any of them
# changing shape. Never on a pull request. Each service is skipped when its
# key is not set. Cost per run: one 16-token xAI completion.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

jobs:
  live:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:live
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          PRINTFUL_API_KEY: ${{ secrets.PRINTFUL_API_KEY }}
          PRINTFUL_STORE_ID: ${{ secrets.PRINTFUL_STORE_ID }}

  # How many deliberately planted bugs the money tests catch. A report, not a gate.
  mutation:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mutation
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mutation-report
          path: coverage/mutation.html
          retention-days: 14
