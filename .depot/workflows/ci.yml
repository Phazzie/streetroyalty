name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Lint, types, unit and integration tests on in-memory Postgres with coverage floors, then the build.
  verify:
    runs-on: depot-ubuntu-24.04
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci

  # The same integration tests against a real Postgres, which is what production runs on.
  # The preview runs on an embedded database, and the two have to behave the same.
  postgres:
    runs-on: depot-ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: streetroyalty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/streetroyalty_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations the way a deploy does
        run: npm run db:migrate
      - name: Integration tests on Postgres
        run: npx vitest run --project integration --no-file-parallelism

  # Real Chromium: the print-file exporter, then every journey against the built app.
  e2e:
    runs-on: depot-ubuntu-24.04
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Print files in a real browser
        run: npm run test:browser
      - run: npm run build
      - name: Journeys against the built app
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  ai-review:
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Grok review
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/ai-review.mjs
